name: Monthly sector snapshot

# Regenerates data/sector_snapshot.json once a month from official NSE index
# constituents + IndianAPI fundamentals. The Streamlit app only READS that file,
# so it never calls IndianAPI at runtime. Monthly cadence keeps usage well under
# the free 500-credit plan (the builder aborts before any call if the unique
# company count would exceed the 400-credit safety ceiling).
#
# This is the single sector-refresh workflow. The builder validates before
# writing and never overwrites a good snapshot with a broken one, so a failed
# run simply keeps the previous snapshot.

on:
  schedule:
    - cron: "0 3 1 * *"        # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}         # allow manual runs from the Actions tab

permissions:
  contents: write               # to commit the refreshed snapshot

concurrency:
  group: sector-snapshot
  cancel-in-progress: false

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch official NSE index constituents
        run: |
          python scripts/fetch_nse_constituents.py || echo "NSE fetch completed with warnings; proceeding with cached constituent lists."

      - name: Refresh sector snapshot
        env:
          # Stored ONLY as a repository secret; never printed or committed.
          INDIANAPI_KEY: ${{ secrets.INDIANAPI_KEY }}
        # Non-zero exit (over-budget abort, or validation failure) fails the job
        # and — because the script never writes on failure — the previous good
        # snapshot is kept. All 9 sectors in one run, capped at 400 credits.
        run: python scripts/refresh_sectors.py --max-budget 400

      - name: Commit refreshed snapshot if changed
        # Only reached when the refresh step succeeded (valid snapshot written).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sector_snapshot.json data/nse_constituents/
          if git diff --staged --quiet; then
            echo "No change in sector snapshot or constituent lists."
          else
            git commit -m "chore(sectors): refresh monthly sector snapshot [skip ci]"
            git push
          fi
