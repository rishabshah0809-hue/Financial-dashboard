name: Monthly Sector Lens Refresh

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: monthly-sector-refresh
  cancel-in-progress: false

jobs:
  refresh-sectors:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch official NSE index constituents
        run: |
          python scripts/fetch_nse_constituents.py || echo "NSE fetch completed with warnings; proceeding with cached lists."

      - name: Refresh sector benchmarks
        env:
          INDIANAPI_KEY: ${{ secrets.INDIANAPI_KEY }}
        run: |
          python scripts/refresh_sectors.py

      - name: Commit and push snapshot updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/sector_snapshot.json data/nse_constituents/
          if git diff --staged --quiet; then
            echo "No changes in sector snapshot or constituent lists."
          else
            git commit -m "chore(sectors): refresh monthly sector snapshot [skip ci]"
            git push
          fi
